services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    command: sh -c "npm ci && npm run prisma:generate && npm run prisma:deploy && npm run start:dev"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/chat_app_db?schema=public
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: database

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_app_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_chat_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  pgdata_chat_app:
  